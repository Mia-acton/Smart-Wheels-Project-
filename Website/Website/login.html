<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login | Smart Wheels</title>
        <link rel="stylesheet" href="login.css">
        <link rel="icon" href="Pictures/steering-wheel.png">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
      </head>
      
<body>

  <div class="login-container">
    <h2>Smart Wheels Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p class="error-msg" id="errorMsg"></p>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (username === 'Mia' && password === 'smart123') {
        window.location.href = `userDashboard.html?user=${username}`;
      } else {
        document.getElementById('errorMsg').textContent = 'Invalid credentials.';
      }
    });
  </script>

</body>
</html>
